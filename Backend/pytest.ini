[pytest]
DJANGO_SETTINGS_MODULE = wealthwise_backend.settings
python_files = tests_*.py test_*.py
python_classes = Test*
python_functions = test_*
addopts = -p no:cacheprovider --ds=wealthwise_backend.settings --cov=api --cov-report=term-missing --cov-report=xml --cov-report=html
testpaths = api
markers =
    auth: Authentication and JWT tests
    rbac: Role-based access control tests
    project_isolation: Project scoping and isolation tests
    pagination: Pagination behavior tests
    filtering: Query filtering tests
    validation: Input validation and serializer tests
    service: Service-layer unit tests
    regression: Regression tests for specific bug fixes
