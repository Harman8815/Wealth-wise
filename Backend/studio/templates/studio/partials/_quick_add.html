{% load studio_tags %}
<form id="quick-add-form" method="post"
      hx-post="{% url 'studio:quick_add' %}" hx-target="#quick-add-result" hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful){ Studio.toast('Transaction added', 'success'); document.getElementById('quick-add-form').reset(); }">
  {% csrf_token %}
  <div class="grid grid-cols-2 gap-3">
    <div class="col-span-2">
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Date</label>
      <input type="date" name="date" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
    </div>
    <div class="col-span-2">
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Description</label>
      <input type="text" name="description" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Amount</label>
      <input type="number" step="0.01" name="amount" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Type</label>
      <select name="type" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Status</label>
      <select name="status" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
        <option value="completed">Completed</option>
        <option value="pending">Pending</option>
      </select>
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Currency</label>
      <input type="text" name="currency" value="INR" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Account</label>
      <select name="account" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
        <option value="">— none —</option>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="mb-1 block text-xs font-medium text-slate-600 dark:text-slate-300">Category name</label>
      <input type="text" name="category_name" list="cat-list" placeholder="e.g. Food" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-800">
      <datalist id="cat-list">
        {% for c in categories %}<option value="{{ c.name }}">{% endfor %}
      </datalist>
    </div>
  </div>
  <div id="quick-add-result"></div>
  <div class="mt-4 flex justify-end">
    <button type="submit" class="rounded-lg bg-wealth-600 px-4 py-2 text-sm font-semibold text-white hover:bg-wealth-700">Add Transaction</button>
  </div>
</form>
